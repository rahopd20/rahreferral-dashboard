document.addEventListener('click',e=>{const r=e.target.closest('rect[data-m]');if(!r)return;const m=+r.dataset.m;if(S.mode=='MM'){S.flip=!S.flip;S.flip?S.mA=m:S.mB=m}else{S.mf=S.mt=m;S.months=new Set([m])}draw()});
const PAL=['#757575','#f0555f','#6abf69'];

const tile=(t,a,b,fm,c)=>`<div class="t" style="background:${c}"><h3>${t}</h3><div class="vv"><div>${fm(a)}<small><b style="color:var(--a)">●</b> ${l0}</small></div><div>${fm(b)}<small><b style="color:var(--b)">●</b> ${l1}</small></div></div><div style="margin-top:4px">${dl(a,b)}</div></div>`;

const dn=(x,k,cs,l)=>{const r=34,C=2*Math.PI*r;let off=0,s=`<circle r="${r}" cx="50" cy="50" fill="none" stroke="var(--ln)" stroke-width="22"/>`,lbl='';cs.forEach((c,i)=>{const p=sh(x,k,c),len=p/100*C;if(p>0){s+=`<circle r="${r}" cx="50" cy="50" fill="none" stroke="${PAL[i]}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"><title>${c}: ${f(x[k][c]||0)} (${p.toFixed(1)}%)</title></circle>`;if(p>=6){const a=(off+len/2)/C*2*Math.PI-Math.PI/2;lbl+=`<text x="${50+r*Math.cos(a)}" y="${50+r*Math.sin(a)+3}" text-anchor="middle" style="fill:#fff;font-size:8px">${p.toFixed(0)}%</text>`}off+=len}});return `<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center"><div class="lb">${l} · n=${f(x.n)}</div><svg viewBox="0 0 100 100" style="flex:1;min-height:0;width:100%">${s}${lbl}</svg></div>`};
document.getElementById('mix').innerHTML=T.map(([k,t,cs])=>`<div class="c"><h2>${t}</h2><div style="display:flex;gap:4px;flex:1;min-height:0">${dn(A,k,cs,l0)}${dn(B,k,cs,l1)}</div><div class="lg">${cs.map((c,i)=>`<span><i style="background:${PAL[i]}"></i>${c}</span>`).join('')}</div></div>`).join('');
const tb=(id,k)=>{const ks=[...new Set([...Object.keys(A[k]),...Object.keys(B[k])])].sort((x,y)=>(B[k][y]||0)+(A[k][y]||0)-(B[k][x]||0)-(A[k][x]||0)).slice(0,10),mx=Math.max(1,...ks.flatMap(c=>[A[k][c]||0,B[k][c]||0]));

tb('nat','nat');tb('ref','ref');chart('c1','n');chart('c2','v')}
let YEARS=[2025,2026],busy=0,mcpNs;const SID='1QaWg2MMHEYXlsNwaQBHynMf8uLXt-II-CWeP7cKlNr8',TAB="'Referral data'!",SRV='Google Sheets',stEl=document.getElementById('st');
const colL=i=>{let s='';for(i++;i>0;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s},sv=(t,c)=>{stEl.textContent=t;stEl.title=c||''};
function build(cols){const g=(c,i)=>String((cols[c][i]||[])[0]??'').trim(),nat=[],ref=[],nm=new Map(),rm=new Map(),id=(mp,arr,v)=>{if(!mp.has(v)){mp.set(v,arr.length);arr.push(v)}return mp.get(v)},dic={no:['NEW','OLD'],ta:['Tourist','Expat','Resident'],tr:['NON TRAUMA','TRAUMA'],vi:['OPD','IPD'],nat,ref},out=[],lc=M.map(m=>m.toLowerCase()),fi=(a,v)=>a.findIndex(x=>x.toLowerCase()==v.toLowerCase());
for(let i=0;i<cols[0].length;i++){const y=+g(0,i),mi=lc.indexOf(g(1,i).slice(0,3).toLowerCase()),s=g(2,i),fl=/refer in|alliance/i.test(s)?1:/refer out/i.test(s)?2:0;if(!y||mi<0||!fl)continue;

out.push([y,mi,fl,fi(dic.no,g(3,i)),fi(dic.ta,g(4,i)),/^trauma$/i.test(g(5,i))?1:0,fi(dic.vi,g(6,i)),id(nm,nat,nn),id(rm,ref,g(8,i)||'(blank)'),parseFloat(g(9,i).replace(/[^0-9.\-]/g,''))||0])}
if(!out.length)throw{code:'schema',message:'No referral rows found'};return{rows:out,d:dic}}
async function live(first){if(busy)return;busy=1;try{mcpNs=mcpNs||(window.claude&&await claude.use('mcp'));if(!mcpNs){sv('Snapshot to 30 Sep 2026');return}
const get=async(r,again)=>{try{const x=await mcpNs.callTool(SRV,'get_values',{spreadsheetId:SID,range:TAB+r});return(x.payload&&x.payload.values)||[]}catch(e){if(e&&e.retryable&&!again){await new Promise(z=>setTimeout(z,e.retryAfterMs||1500));return get(r,1)}throw e}};
sv('Loading live data…');const hd=(await get('A1:BO1'))[0]||[],need=['Year','Month','Referal Status','New/Old','Patient Type','Trauma','EN Type','Nationality','Referer','Bill Amount'],ci=need.map(n=>hd.indexOf(n));

if(first||!ys.includes(S.yA)||!ys.includes(S.yB)){S.yB=ys[ys.length-1];S.yA=ys.length>1?ys[ys.length-2]:S.yB;const mm=Math.max(...R.filter(r=>r[0]==S.yB).map(r=>r[1]));S.mf=0;S.mt=mm;S.months=new Set(Array.from({length:mm+1},(_,i)=>i))}

catch(e){const c=e&&e.code;sv(c=='server_not_connected'?'Snapshot · add Google Sheets in Settings > Connectors':c=='needs_reauth'?'Snapshot · reconnect Google Sheets':(c=='not_in_manifest'||c=='consent_required')?'Snapshot · live data not allowed':c=='schema'?'Snapshot · '+e.message:'Snapshot · live fetch failed',e&&e.message)}finally{busy=0}}
